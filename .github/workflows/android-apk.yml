
name: Build APK Store

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q apk_store_android_source.zip -d source
          FILE=$(find source -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts \) \
            -print -quit)
          if [ -z "$FILE" ]; then
            echo "Android project settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Store-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  
